- name: Deploy React App
  env:
    VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
  run: |
    sshpass -p "$VM_PASSWORD" ssh -o StrictHostKeyChecking=no $VM_USER@$VM_HOST << 'EOF'
      set -e

      sudo apt-get update
      sudo apt-get install -y docker.io git curl

      sudo systemctl enable docker
      sudo systemctl start docker

      # Install Node.js 20
      curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
      sudo apt-get install -y nodejs

      node -v
      npm -v

      # Fresh clone
      rm -rf /home/azureuser/react-app
      git clone https://github.com/devopsinsiders/ReactTodoUIMonolith.git /home/azureuser/react-app

      cd /home/azureuser/react-app

      # Install dependencies and build React app
      npm install
      npm run build

      # Create Dockerfile dynamically
      cat > Dockerfile << 'DOCKERFILE'
      FROM nginx:alpine
      COPY build/ /usr/share/nginx/html
      EXPOSE 80
      CMD ["nginx", "-g", "daemon off;"]
      DOCKERFILE

      echo "===== GENERATED DOCKERFILE ====="
      cat Dockerfile

      sudo docker rm -f react-todo || true

      sudo docker build -t react-todo:latest .

      sudo docker run -d \
        --name react-todo \
        -p 3000:80 \
        --restart always \
        react-todo:latest

      echo "===== RUNNING CONTAINERS ====="
      sudo docker ps
    EOF