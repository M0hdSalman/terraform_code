name: Infra Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read
  security-events: write
  actions: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # Code Quality
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      # Security Scan
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: environments

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Terraform Plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # Capture VM outputs dynamically
      - name: Capture VM Outputs
        run: |
          VM_HOST=$(terraform output -json vm_public_ips | jq -r '.vm1_pip')
          VM_USER=$(terraform output -json vm_admin_usernames | jq -r '.vm1')

          echo "VM_HOST=$VM_HOST" > vm.env
          echo "VM_USER=$VM_USER" >> vm.env

          cat vm.env

      # Upload artifact for next workflow
      - name: Upload VM Info Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vm-info
          path: environments/vm.env
