name: Debug VM Outputs

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: terraform init -input=false

      - name: Show All Terraform Outputs
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          echo "===== ALL OUTPUTS ====="
          terraform output

          echo "===== JSON OUTPUTS ====="
          terraform output -json

          echo "===== VM PUBLIC IPS ====="
          terraform output -json vm_public_ips || true

          echo "===== VM USERS ====="
          terraform output -json vm_admin_usernames || true

      - name: Extract First VM Values
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          VM_HOST=$(terraform output -json vm_public_ips | jq -r 'to_entries[0].value')
          VM_USER=$(terraform output -json vm_admin_usernames | jq -r 'to_entries[0].value')

          echo "VM_HOST=$VM_HOST"
          echo "VM_USER=$VM_USER"

          echo "VM_HOST=$VM_HOST" > vm.env
          echo "VM_USER=$VM_USER" >> vm.env

          echo "===== vm.env ====="
          cat vm.env
